name: Build Pixel Clicker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel-clicker-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Create GitHub Release with APK download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pixel Clicker v1.0.${{ github.run_number }}
          body: |
            ### 🎮 Pixel Clicker (Android 16 • RuStore Ready)
            - **`app-release.apk`** — официальная подписанная релизная сборка для загрузки в **RuStore**!
            - **`app-debug.apk`** — тестовая сборка для телефона.
            - Новый чистый векторный логотип (без ИИ слопа).
            - Цифровая подпись разработчика (Keystore RSA 2048).
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
