name: Build Pixel Clicker APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixel-clicker-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pixel Clicker v1.0.${{ github.run_number }}
          body: |
            ### 🎮 Pixel Clicker (Android 16 • PixelOS)
            - **Готовый APK файл для установки на телефон** прикреплен ниже (`app-debug.apk`).
            - **Material You Monet:** динамические цвета приложения адаптируются под цвет ваших обоев на PixelOS.
            - **Haptic feedback:** тактильная виброотдача при каждом тапе.
            - **Splash Screen:** фирменный плавный запуск в стиле Google Pixel.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
